name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m maintainer_digest --input examples/demo-snapshot.json --lang zh --output report.md
      - run: git diff --exit-code

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - name: Verify installed entry point outside checkout
        working-directory: /tmp
        run: maintainer-digest --version
